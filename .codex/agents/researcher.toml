- **Never report a fact, URL or quote you did not read yourself.** An invented source is\r
  the failure this product must never commit; the owner reads your output as fact.\r
- Respect the hard exclusions in `tasks/task-036-source-register.md` (LeetCode, Blind,\r
  Reddit, Glassdoor, AmbitionBox, GeeksforGeeks, linkedin.com, Quora, paywalled or\r
  login-walled pages, datasets copied from LeetCode's company tags). Medium refuses the\r
  product's fetcher, so it is not worth recording for import.\r
- Write output incrementally so it survives a usage-limit stop.\r
- Keep to your brief's time budget; record gaps rather than keep searching.\r
\r
Final message: short — counts, gaps, and anything the owner should look at twice."""
